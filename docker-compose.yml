version: '3.9'

services:
  # PostgreSQL with TimescaleDB
  postgres:
    image: timescale/timescaledb:2.13.0-pg16
    container_name: apimonitor_postgres
    environment:
      POSTGRES_USER: apimonitor
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: apimonitor
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apimonitor -d apimonitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - apimonitor_network

  # Redis for caching and Celery broker
  redis:
    image: redis:7-alpine
    container_name: apimonitor_redis
    command: redis-server --appendonly yes --requirepass redispassword123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - apimonitor_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: apimonitor_backend
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://apimonitor:securepassword123@postgres:5432/apimonitor
      - DATABASE_URL_SYNC=postgresql://apimonitor:securepassword123@postgres:5432/apimonitor
      - REDIS_URL=redis://:redispassword123@redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production-min-32-characters
      - JWT_SECRET_KEY=dev-jwt-secret-key-change-in-production-min-32-chars
      - CELERY_BROKER_URL=redis://:redispassword123@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:redispassword123@redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    networks:
      - apimonitor_network

  # Celery Worker for monitoring tasks
  celery_worker:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: apimonitor_celery_worker
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://apimonitor:securepassword123@postgres:5432/apimonitor
      - REDIS_URL=redis://:redispassword123@redis:6379/0
      - CELERY_BROKER_URL=redis://:redispassword123@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:redispassword123@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    restart: unless-stopped
    networks:
      - apimonitor_network

  # Celery Beat for scheduled tasks
  celery_beat:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: apimonitor_celery_beat
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://apimonitor:securepassword123@postgres:5432/apimonitor
      - REDIS_URL=redis://:redispassword123@redis:6379/0
      - CELERY_BROKER_URL=redis://:redispassword123@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:redispassword123@redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    command: celery -A app.workers.celery_app beat --loglevel=info
    restart: unless-stopped
    networks:
      - apimonitor_network

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
      target: development
    container_name: apimonitor_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev
    restart: unless-stopped
    networks:
      - apimonitor_network

  # Flower - Celery monitoring (optional)
  flower:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
    container_name: apimonitor_flower
    environment:
      - CELERY_BROKER_URL=redis://:redispassword123@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:redispassword123@redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    command: celery -A app.workers.celery_app flower --port=5555
    restart: unless-stopped
    networks:
      - apimonitor_network

  # Prometheus for metrics collection (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: apimonitor_prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - apimonitor_network

  # Grafana for metrics visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: apimonitor_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - apimonitor_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  apimonitor_network:
    driver: bridge
