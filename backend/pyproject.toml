[tool.poetry]
name = "api-monitor-backend"
version = "1.0.0"
description = "API Monitoring Platform Backend with FastAPI"
authors = ["API Monitor Team <dev@apimonitor.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = {extras = ["email"], version = "^2.5.3"}
pydantic-settings = "^2.1.0"

# Database
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"

# Redis & Caching
redis = {extras = ["hiredis"], version = "^5.0.1"}
hiredis = "^2.3.2"

# Celery for background tasks
celery = {extras = ["redis"], version = "^5.3.6"}
flower = "^2.0.1"

# Security & Authentication
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
bcrypt = "^4.1.2"

# HTTP Client
httpx = "^0.26.0"
aiohttp = "^3.9.1"

# Utilities
python-dateutil = "^2.8.2"
pytz = "^2023.3"
tenacity = "^8.2.3"
email-validator = "^2.1.0"

# Logging & Monitoring
structlog = "^24.1.0"
sentry-sdk = {extras = ["fastapi"], version = "^1.40.0"}
prometheus-client = "^0.19.0"
prometheus-fastapi-instrumentator = "^6.1.0"

# Rate Limiting
slowapi = "^0.1.9"
limits = "^3.7.0"

# DNS & Network
dnspython = "^2.4.2"

# Templating (for emails)
jinja2 = "^3.1.2"

# Data validation
jsonschema = "^4.20.0"

# Stripe for billing
stripe = "^7.10.0"

# Background job scheduler
apscheduler = "^3.10.4"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^7.4.4"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
faker = "^22.0.0"

# Code quality
black = "^23.12.1"
flake8 = "^7.0.0"
mypy = "^1.8.0"
isort = "^5.13.2"
pylint = "^3.0.3"

# Security scanning
bandit = "^1.7.6"
safety = "^3.0.1"

# Development tools
ipython = "^8.20.0"
ipdb = "^0.13.13"
rich = "^13.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
follow_imports = "silent"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=app --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
